<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta -->
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="BOUND" property="og:title">
    <meta content="Build without limits" property="og:description">
    <meta content="https://itsmike613.github.io/bound/" property="og:url">
    <meta content="https://github.com/itsmike613/bound/blob/main/Source/Images/logo.png?raw=true" property="og:image">
    <meta content="#3A94E9" name="theme-color">

    <!-- Tab -->
    <link rel="icon" type="image/png" href="Source/Images/logo.png">
    <title>BOUND</title>

    <!-- Styles -->
    <link rel="stylesheet" href="Source/Styles/index.css">
</head>

<body>
    <div id="app">
        <aside>
            <header>
                <h1>BOUND<span>ITSMIKE613</span></h1>
                <p>BUILD WITHOUT LIMITS</p>
            </header>
            <div class="heading"><span>BLOCKS</span><span id="total">56 TOTAL</span></div>
            <div id="palette"></div>
            <div class="info"><span>SELECTED</span><span id="number">WHTLT</span></div>
            <div class="info"><span>COORDINATES</span><span id="coords">X: 0 Y: 0 Z: 0</span></div>
            <div class="info"><span>STATUS</span><span id="mode">WALK</span></div>
            <a id="help" href="help.html">HELP</a>
        </aside>
        <main id="view">
            <div id="cross"></div>
            <div id="error" hidden></div>
            <form id="command" hidden>
                <strong>/</strong><input id="input" type="text" autocomplete="off" spellcheck="false">
            </form>
        </main>
    </div>

    <script type="module" src="Source/Scripts/index.js"></script>
</body>

</html>
