<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta -->
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="BOUND" property="og:title">
    <meta content="Build without limits" property="og:description">
    <meta content="https://itsmike613.github.io/bound/" property="og:url">
    <meta content="https://github.com/itsmike613/bound/blob/main/Source/Images/logo.png?raw=true" property="og:image">
    <meta content="#3A94E9" name="theme-color">

    <!-- Tab -->
    <link rel="icon" type="image/png" href="Source/Images/logo.png">
    <title>BOUND</title>

    <!-- Styles -->
    <link rel="stylesheet" href="Source/Styles/index.css">
</head>

<body>
    <div id="app">
        <aside>
            <header>
                <h1>BOUND<span>ITSMIKE613</span></h1>
                <p>BUILD WITHOUT LIMITS</p>
            </header>
            <div class="heading"><span>BLOCKS</span><span>56 TOTAL</span></div>
            <div id="palette"></div>
            <div id="chosen"><span id="label">WHITE / LIGHTEST</span><span id="number">01 / 56</span></div>
            <footer>
                <div class="heading"><span>CONTROLS</span><span id="mode">WALK</span></div>
                <div class="help"><span>W A S D</span><span>MOVE</span></div>
                <div class="help"><span>MOUSE</span><span>LOOK · CLICK TO LOCK</span></div>
                <div class="help"><span>LEFT / RIGHT</span><span>BREAK / PLACE</span></div>
                <div class="help"><span>WHEEL · Q / E</span><span>CHOOSE BLOCK</span></div>
                <div class="help"><span>SPACE</span><span>JUMP · DOUBLE TAP FLY</span></div>
                <div class="help"><span>SHIFT / ESC</span><span>DESCEND / UNLOCK</span></div>
            </footer>
        </aside>
        <main id="view">
            <div id="cross"></div>
        </main>
    </div>

    <script type="module" src="Source/Scripts/index.js"></script>
</body>

</html>
